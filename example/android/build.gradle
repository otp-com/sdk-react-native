buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        // 26 because the otp.com SDK requires it: hardware-backed key attestation is only guaranteed
        // from here. React Native's own floor is 24, so this is the one line an app adds to use the
        // package.
        minSdkVersion = 26
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

